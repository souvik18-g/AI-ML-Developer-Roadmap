<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>

<body>

    <h1>Welcome {{ name }}</h1>

    {% if is_student %}
        <p>You are a student.</p>
        <h2>Your Courses:</h2>
        <h3>List of Courses:</h3>
        <ul>
            {% for course in courses %}
                <li>{{ course }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You are not a student.</p>
    {% endif %}

</body>
</html>
