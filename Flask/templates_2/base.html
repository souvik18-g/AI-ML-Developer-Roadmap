<!DOCTYPE html>
<html lang="en">
<head>   
    <title>
        {% block title %}My Feedback Site{% endblock %}
    </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        header, footer {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Feedback Site</h1>
   

    <nav>
        
        <a href="/feedback">Feedback</a> |
       
    </nav>
    </header>

    <main>
        {% block content %}
        <!-- Content will be injected here -->
        {% endblock %}
    </main>

    <footer>
        &copy; 2026 My Feedback Site
    </footer>
    
</body>
</html>
