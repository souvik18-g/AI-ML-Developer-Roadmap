<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        {% block title %} Flask-WTF Form {% endblock %}
    </title>
</head>
<body>

    <h1>Flask-WTF Registration Form</h1>
    {%with messages = get_flashed_messages(with_categories=true) %}    
        {% if messages %}
            {% for category, message in messages %}
            
            
            <p style ="color: green;">{{ message }}</p>                   
            {% endfor %}
        {% endif %}
    {% endwith %}
{% block content %}{% endblock %}
    
</body>
</html>
